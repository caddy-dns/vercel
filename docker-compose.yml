services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caddy-vercel
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - /root/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
